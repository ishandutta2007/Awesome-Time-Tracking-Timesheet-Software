<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Filter for glow effects -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="pulseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Keyframe Animations */
    @keyframes spinClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes pulseRing {
      0%, 100% { r: 52px; opacity: 0.35; }
      50% { r: 60px; opacity: 0.75; }
    }

    @keyframes liveBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    @keyframes waveDash {
      to { stroke-dashoffset: -100; }
    }

    @keyframes barGrow1 {
      0%, 100% { height: 35px; y: 45px; }
      50% { height: 60px; y: 20px; }
    }

    @keyframes barGrow2 {
      0%, 100% { height: 55px; y: 25px; }
      50% { height: 75px; y: 5px; }
    }

    @keyframes barGrow3 {
      0%, 100% { height: 42px; y: 38px; }
      50% { height: 65px; y: 15px; }
    }

    @keyframes barGrow4 {
      0%, 100% { height: 68px; y: 12px; }
      50% { height: 45px; y: 35px; }
    }

    @keyframes cardFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .second-hand {
      transform-origin: 1040px 170px;
      animation: spinClockwise 12s linear infinite;
    }

    .minute-hand {
      transform-origin: 1040px 170px;
      animation: spinClockwise 72s linear infinite;
    }

    .pulse-circle {
      animation: pulseRing 3s ease-in-out infinite;
    }

    .live-dot {
      animation: liveBlink 1.6s ease-in-out infinite;
    }

    .dashed-track {
      stroke-dasharray: 8 6;
      animation: waveDash 20s linear infinite;
    }

    .floating-card {
      animation: cardFloat 5s ease-in-out infinite;
    }

    .bar-anim-1 { animation: barGrow1 3.5s ease-in-out infinite; }
    .bar-anim-2 { animation: barGrow2 4s ease-in-out infinite; }
    .bar-anim-3 { animation: barGrow3 3.8s ease-in-out infinite; }
    .bar-anim-4 { animation: barGrow4 4.2s ease-in-out infinite; }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }

    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 400;
      fill: #94a3b8;
    }

    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1198" height="418" x="1" y="1" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Ambient background glow spots (strictly in background) -->
  <circle cx="150" cy="80" r="140" fill="url(#glowGrad)" filter="url(#softGlow)" />
  <circle cx="1060" cy="180" r="160" fill="url(#glowGrad)" filter="url(#softGlow)" />

  <!-- Decorative technical grid lines (subtle background) -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="420" />
    <line x1="200" y1="0" x2="200" y2="420" />
    <line x1="320" y1="0" x2="320" y2="420" />
    <line x1="440" y1="0" x2="440" y2="420" />
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="360" x2="1200" y2="360" />
  </g>

  <!-- Flowing animated data track in background -->
  <path d="M 60 380 Q 250 330 450 370 T 850 330 T 1150 370" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="2" class="dashed-track" />

  <!-- ================= RIGHT SIDE: DYNAMIC TIME TRACKER / ANALYTICS WIDGET ================= -->
  <g class="floating-card" transform="translate(0, 0)">
    <!-- Main Widget Container -->
    <rect x="880" y="55" width="260" height="305" rx="16" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.22)" stroke-width="1.5" />

    <!-- Clock dial & hands -->
    <g id="analogClock">
      <!-- Outer Dial -->
      <circle cx="1010" cy="140" r="54" fill="#090d16" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />
      <circle cx="1010" cy="140" r="52" fill="none" stroke="#06b6d4" stroke-width="1.5" class="pulse-circle" />
      
      <!-- Clock Ticks -->
      <line x1="1010" y1="92" x2="1010" y2="98" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
      <line x1="1010" y1="182" x2="1010" y2="188" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
      <line x1="962" y1="140" x2="968" y2="140" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
      <line x1="1052" y1="140" x2="1058" y2="140" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

      <!-- Center Pivot -->
      <circle cx="1010" cy="140" r="4" fill="#ffffff" />

      <!-- Hour Hand (static pointing to 10) -->
      <line x1="1010" y1="140" x2="988" y2="122" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

      <!-- Minute Hand (slow rotating) -->
      <line x1="1010" y1="140" x2="1010" y2="104" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" class="minute-hand" style="transform-origin: 1010px 140px;" />

      <!-- Second Hand (continuous sweep) -->
      <line x1="1010" y1="148" x2="1010" y2="95" stroke="#f43f5e" stroke-width="1.5" stroke-linecap="round" class="second-hand" style="transform-origin: 1010px 140px;" />
      <circle cx="1010" cy="140" r="2.5" fill="#f43f5e" />
    </g>

    <!-- Live Timer Status -->
    <rect x="910" y="210" width="200" height="42" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <circle cx="928" cy="231" r="5" fill="#10b981" class="live-dot" />
    <text x="942" y="235" font-family="monospace" font-size="14" font-weight="700" fill="#34d399">03:47:18</text>
    <text x="1035" y="235" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">TRACKING</text>

    <!-- Mini Timesheet Activity Bars (Animated) -->
    <g transform="translate(920, 265)">
      <rect x="0" y="0" width="180" height="1" fill="rgba(255,255,255,0.08)" />
      
      <!-- Day bars -->
      <!-- Mon -->
      <rect x="10" y="30" width="14" height="40" rx="3" fill="#38bdf8" opacity="0.8" class="bar-anim-1" />
      <text x="11" y="80" class="subtitle-text" font-size="9">M</text>
      
      <!-- Tue -->
      <rect x="42" y="15" width="14" height="55" rx="3" fill="#6366f1" opacity="0.85" class="bar-anim-2" />
      <text x="44" y="80" class="subtitle-text" font-size="9">T</text>
      
      <!-- Wed -->
      <rect x="74" y="25" width="14" height="45" rx="3" fill="#8b5cf6" opacity="0.85" class="bar-anim-3" />
      <text x="75" y="80" class="subtitle-text" font-size="9">W</text>
      
      <!-- Thu -->
      <rect x="106" y="10" width="14" height="60" rx="3" fill="#06b6d4" opacity="0.9" class="bar-anim-4" />
      <text x="108" y="80" class="subtitle-text" font-size="9">T</text>
      
      <!-- Fri -->
      <rect x="138" y="20" width="14" height="50" rx="3" fill="#10b981" opacity="0.85" class="bar-anim-1" />
      <text x="141" y="80" class="subtitle-text" font-size="9">F</text>
    </g>
  </g>

  <!-- ================= FOREGROUND: CLEAR TITLE & VALUE PROPOSITION ================= -->
  <!-- Top Category / Status Badge -->
  <g transform="translate(80, 52)">
    <rect x="0" y="0" width="220" height="30" rx="15" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
    <circle cx="16" cy="15" r="4.5" fill="#38bdf8" />
    <text x="28" y="20" class="tag-text" fill="#38bdf8">CURATED AWESOME LIST</text>
  </g>

  <!-- Primary Headline -->
  <g transform="translate(80, 130)">
    <text x="0" y="0" class="title-text" font-size="44">Awesome Time Tracking</text>
    <text x="0" y="52" class="title-text" font-size="44">&amp; Timesheet Software</text>
  </g>

  <!-- Accent Gradient Rule -->
  <rect x="80" y="205" width="380" height="4" rx="2" fill="url(#accentGrad)" />

  <!-- Subtitle / Mission Statement -->
  <g transform="translate(80, 245)">
    <text x="0" y="0" class="subtitle-text" font-size="17" fill="#cbd5e1">
      Top commercial SaaS &amp; self-hosted open-source solutions for
    </text>
    <text x="0" y="26" class="subtitle-text" font-size="17" fill="#cbd5e1">
      billable hours, project management, and client invoicing.
    </text>
  </g>

  <!-- Feature / Topic Pills (Foreground) -->
  <g transform="translate(80, 318)">
    <!-- Pill 1: Time Tracking -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="138" height="34" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" />
      <circle cx="15" cy="17" r="4" fill="#06b6d4" />
      <text x="27" y="22" class="tag-text" fill="#e2e8f0">Time Tracking</text>
    </g>

    <!-- Pill 2: Timesheets -->
    <g transform="translate(148, 0)">
      <rect x="0" y="0" width="120" height="34" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.2" />
      <circle cx="15" cy="17" r="4" fill="#6366f1" />
      <text x="27" y="22" class="tag-text" fill="#e2e8f0">Timesheets</text>
    </g>

    <!-- Pill 3: Invoicing & Billing -->
    <g transform="translate(278, 0)">
      <rect x="0" y="0" width="158" height="34" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.2" />
      <circle cx="15" cy="17" r="4" fill="#10b981" />
      <text x="27" y="22" class="tag-text" fill="#e2e8f0">Invoicing &amp; Billing</text>
    </g>

    <!-- Pill 4: Open Source -->
    <g transform="translate(446, 0)">
      <rect x="0" y="0" width="132" height="34" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1.2" />
      <circle cx="15" cy="17" r="4" fill="#8b5cf6" />
      <text x="27" y="22" class="tag-text" fill="#e2e8f0">Open Source</text>
    </g>

    <!-- Pill 5: SaaS Platforms -->
    <g transform="translate(588, 0)">
      <rect x="0" y="0" width="144" height="34" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(244, 63, 94, 0.4)" stroke-width="1.2" />
      <circle cx="15" cy="17" r="4" fill="#f43f5e" />
      <text x="27" y="22" class="tag-text" fill="#e2e8f0">SaaS Platforms</text>
    </g>
  </g>
</svg>
